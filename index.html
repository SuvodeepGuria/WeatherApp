<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #4682B4 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 1s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .author {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .search-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .search-section input {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            width: 300px;
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-section button {
            padding: 12px 30px;
            font-size: 16px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .search-section button:hover {
            background: #1B5E20;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }

        .search-section select {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            outline: none;
            cursor: pointer;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .weather-display {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .weather-icon {
            font-size: 120px;
            margin: 20px 0;
            animation: fadeIn 0.5s;
        }

        .temperature {
            font-size: 72px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s;
        }

        .weather-desc {
            font-size: 28px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .weather-details {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 30px;
            font-size: 20px;
            flex-wrap: wrap;
        }

        .history-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .history-panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
            border-bottom: 2px solid #2E7D32;
            padding-bottom: 10px;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            color: #555;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(46, 125, 50, 0.1);
        }

        .clear-history {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .clear-history:hover {
            background: #b71c1c;
        }

        .forecast-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .forecast-section h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .forecast-placeholder {
            grid-column: 1 / -1;
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 18px;
        }

        .forecast-day {
            text-align: center;
            color: white;
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .forecast-day:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .forecast-day-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 48px;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .history-panel::-webkit-scrollbar {
            width: 8px;
        }

        .history-panel::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .history-panel::-webkit-scrollbar-thumb {
            background: #2E7D32;
            border-radius: 10px;
        }

        .history-panel::-webkit-scrollbar-thumb:hover {
            background: #1B5E20;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .temperature {
                font-size: 56px;
            }

            .weather-desc {
                font-size: 22px;
            }

            .weather-details {
                flex-direction: column;
                gap: 15px;
            }

            .search-section input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Information App</h1>
        <p class="author">By Suvodeep Guria</p>
        <div class="search-section">
            <input type="text" id="locationInput" placeholder="Enter city name..."
                onkeypress="if(event.key==='Enter') searchWeather()">
            <button onclick="searchWeather()">Search</button>
            <select id="unitSelector" onchange="convertUnits()">
                <option value="metric">Celsius</option>
                <option value="imperial">Fahrenheit</option>
            </select>
        </div>

        <div class="main-content">
            <div class="weather-display">
                <div class="weather-icon" id="weatherIcon">❓</div>
                <div class="temperature" id="temperature">-- °C</div>
                <div class="weather-desc" id="weatherDesc">Enter a location to get weather</div>
                <div class="weather-details">
                    <div id="humidity">💧 Humidity: --</div>
                    <div id="windSpeed">💨 Wind: --</div>
                </div>
            </div>

            <div class="history-panel">
                <h3>Search History</h3>
                <div id="historyList"></div>
                <button class="clear-history" onclick="clearHistory()">Clear History</button>
            </div>
        </div>

        <div class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div class="forecast-grid" id="forecastGrid">
                <div class="forecast-placeholder">Search for a city to see forecast</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
